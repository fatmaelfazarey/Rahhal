<div class="  h-fit max-w-screen-xl mx-auto px-4  w-full pb-5" dir="rtl">
    <h2 class="text-2xl sm:text-3xl text-dark mb-2 text-center md:text-right">مميزات الخدمة</h2>
    <ul class="flex flex-wrap justify-between gap-1 md:gap-1 ">
        <li *ngFor="let item of featuresData; let i = index" class="flex flex-col items-center p-5 bg-white  shadow-sm hover:shadow-md transition-all duration-300 hover:bg-primary
                   w-full xs:w-[85%] sm:w-[45%] md:w-[30%] lg:w-[24%] xl:w-[24%] h-[120px]  justify-center 
                    group relative">
            <a
                class="text-dark text-center font-medium group-hover:text-second transition-colors duration-300 cursor-pointer">
                {{ item }}
            </a>
        </li>
    </ul>
</div>
