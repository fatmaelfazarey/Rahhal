<div class="flex flex-col relative  w-full mb-100 md:mb-60 px-4">
    <div class="max-w-screen-xl mx-auto p-2 z-30 w-full service-card  mt-3 rounded-4xl ">
        <div class="h-fit flex flex-row justify-between items-centergap-4 md:gap-0 z-20  " dir="rtl">
            <a class="w-[150px] flex-shrink-0" aria-label="Go to homepage">
                <img [src]="assets.logo" alt="Website logo" class="w-full h-auto" width="155" height="auto">
            </a>

            <button aria-label="Inquiry" routerLink="/orders"
                class="border-3 rounded-full border-primary w-[100px] p-2 bg-second text-dark hover:bg-primary hover:text-second duration-300 ease-in-out transition-colors text-sm">
                استعلام
            </button>
        </div>
    </div>



    <!-- الخلفية المتغيرة -->
    <div class="absolute inset-0 bg-cover bg-center bg-image-transition overflow-hidden">
        <!-- عرض الصورة إذا كانت الوسائط الحالية صورة -->
        <div *ngIf="!isVideo" class="absolute inset-0 bg-cover bg-center"
            [style.background-image]="'url(' + currentMediaUrl + ')'">
            <div class="absolute inset-0 bg-black bg-opacity-40">
                <img [src]="currentMediaUrl" alt="Service background" class="w-full h-full object-cover" />
            </div>
        </div>

        <!-- عرض الفيديو إذا كانت الوسائط الحالية فيديو -->
        <div *ngIf="isVideo" class="absolute inset-0">
            <video #backgroundVideo class="w-full h-full object-cover" [src]="currentMediaUrl" muted loop playsinline>
                المتصفح الخاص بك لا يدعم تشغيل الفيديو.
            </video>
            <div class="absolute inset-0 b40"></div>
        </div>
    </div>

    <!-- باقي محتوى المكون (إن وجد) -->

    <div class="service-container max-w-screen-xl mx-auto w-full  h-full z-50" dir="rtl">
        <div class="relative w-full  rounded-2xl   h-[100vh] ">
            <!-- محتوى الخدمة -->
            <div class="relative z-10 h-full flex flex-col justify-center items-center  w-full ">
                <div
                    class="service-card rounded-2xl bg-white w-full  shadow-xl p-4 py-12 absolute top-[100%] -translate-y-[50%]">
                    <h1 class="text-3xl md:text-4xl font-bold text-primary text-center mb-4">{{ serviceData.name }}</h1>
                    <p class="text-center text-dark mb-4">{{ serviceData.marketingSentence }}</p>
                    <p class="text-center text-dark mb-4">{{ serviceData.description }}</p>
                    <div class="flex  justify-center  flex-col md:flex-row">
                        <div
                            class=" w-full text-dark flex flex-col justify-center items-center px-4 py-2 gap-2 md:mb-0 mb-1">
                            <span class="text-primary text-3xl font-semibold">{{ serviceData.price }} <span
                                    class="text-primary text-base font-light">ج.م</span></span>

                            <span class=" text-xl">سعر الخدمة يبداء من </span>

                        </div>
                        <div
                            class=" w-full text-dark flex flex-col justify-center items-center px-4 py-2 gap-2 md:mb-0 mb-1">
                            <span class="text-primary text-3xl font-semibold">{{ serviceData.time }} <span
                                    class="text-primary text-base font-light">دقيقه</span> </span>

                            <span class=" text-xl">زمن التنفيذ</span>

                        </div>
                        <div
                            class=" w-full text-dark flex flex-col justify-center items-center px-4 py-2 gap-2 md:mb-0 mb-1">

                            <span class="text-primary text-3xl font-semibold">{{ serviceData.CustomerSatisfaction
                                }}</span>
                            <span class=" text-xl">رضا العملاء</span>
                        </div>
                        <div class=" w-full text-dark flex flex-col justify-center items-center px-4 py-2 gap-2 ">

                            <span class="text-primary text-3xl font-semibold">{{ serviceData.orders }}</span>
                            <span class=" text-xl">عدد الطلبات </span>
                        </div>
                    </div>




                </div>
            </div>

        </div>
    </div>

</div>
