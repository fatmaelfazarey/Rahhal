<div class=" bg-primary ">
    <div class="bg-second pb-12 ">
        <div class="max-w-screen-xl pb-2.5 mx-auto px-4 w-full bg-gradient-to-l bg-primary rounded-xl h-auto lg:h-[300px] mt-12 md:mt-20 lg:mt-28 xl:mt-36 flex flex-col lg:flex-row items-center justify-between relative "
            dir="rtl">

            <!-- Text Content -->
            <div data-aos="fade-left"
                class="w-full lg:w-[60%] xl:w-[70%] text-center lg:text-right py-8 lg:py-0 px-4 md:px-8 lg:px-12 xl:px-[80px] z-10">
                <div class="text-second mb-6 md:mb-8">
                    <p class="text-lg md:text-xl  lg:text-xl xl:text-2xl ">
                        مع رحّال، صار طلب الخدمة أسهل من أي وقت مضى. بنقدملك تجربة سلسة تبدأ بخطوات بسيطة وتنتهي براحة
                        بال تامة،
                        لأننا نهتم بكل التفاصيل بدلًا عنك. سواء كنت تبحث عن خدمة سريعة، آمنة أو مدعومة بفريق متخصص، تقدر
                        تحجز
                        بثوانٍ وتستمتع برحلة خالية من القلق. كل اللي عليك تختار الخدمة، ونحن نتكفّل بالباقي.
                    </p>
                </div>
                <button aria-label="Inquiry" routerLink="/orders"
                    class="border-2 border-second rounded-lg px-6 py-3 bg-second text-primary font-medium hover:bg-primary hover:text-second duration-300 ease-in-out transition-colors text-sm md:text-base w-full md:w-auto transform hover:scale-105 transition-transform shadow-md hover:shadow-lg">
                    احجز الخدمة الآن
                </button>
            </div>

            <!-- Image -->
            <div data-aos="fade-right"
                class="w-[350px] md:w-74 lg:w-[380px] xl:w-[400px] relative lg:absolute lg:bottom-0 lg:left-12 xl:left-[80px] mt-6 lg:mt-0 flex justify-center z-0">
                <img [src]="assets.MobileMockup" alt="رحال تطبيق الجوال"
                    class="w-3/4 md:w-full h-auto object-contain transition-all duration-500 " />
            </div>
        </div>
    </div>
</div>
