<div id="services" class="max-w-screen-xl mx-auto px-4 py-12 w-full">
    <!-- Section Title -->
    <div class="text-center mb-8 md:mb-12">
        <h2 class="text-2xl sm:text-3xl font-bold text-primary mb-2">خدماتنا</h2>
        <p class="text-gray-600 max-w-2xl mx-auto px-4 text-sm sm:text-base">نقدم لكم مجموعة متكاملة من الخدمات المتميزة
            التي تلبي جميع احتياجاتكم</p>
    </div>

    <!-- Services Cards -->
    <div class="flex flex-row-reverse flex-wrap justify-center gap-4 md:gap-6  ">
        <div *ngFor="let service of services" [routerLink]="'/service/' + service.navigateTo"
            class="service-card w-full xs:w-[85%] sm:w-[48%] md:w-[45%] lg:w-[30%] xl:w-[30%] bg-white rounded-lg overflow-hidden shadow-md h-full transition-all duration-300 hover:shadow-lg hover:-translate-y-1 border-b-4 border-transparent hover:border-primary group">

            <!-- Service Image -->
            <div
                class="w-full h-48 sm:h-52 md:h-56 lg:h-60 overflow-hidden bg-second p-2 flex justify-center items-center">
                <img [src]="service.serviceImage" [alt]="service.serviceName"
                    class="max-h-[90%] max-w-[90%] group-hover:image_scale transform transition-transform duration-300" />
            </div>

            <!-- Card Content -->
            <div class="p-3 sm:p-4 flex flex-row-reverse justify-between items-center">
                <p class="font-bold text-primary text-base sm:text-lg">{{service.serviceName}}</p>
                <div
                    class="text-primary transform transition-transform duration-300 group-hover:animate-arrow_bounce bg-primary p-1 rounded-2xl ">
                    <svg height="20px" width="20px" class="w-5 h-5 sm:w-6 sm:h-6" version="1.1" id="Layer_1"
                        xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"

            </div>
        </div>
    </div>
