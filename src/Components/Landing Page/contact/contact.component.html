<div class=" bg-primary">
    <div class="bg-white ">
        <div class="max-w-screen-xl mx-auto px-4 py-12 w-full md:pb-12 pb-[380px]" dir="rtl" id="contact">
            <!-- Alert Notification -->
            <div *ngIf="showAlert"
                [class]="alertType === 'success' ? 'bg-green-100 border-green-400 text-green-700' : 'bg-red-100 border-red-400 text-red-700'"
                class="border fixed top-4 right-4 left-4 md:left-auto md:max-w-md rounded-lg px-4 py-3 mb-4 z-50 transition-all duration-300"
                role="alert">
                <div class="flex justify-between items-start">
                    <div class="flex items-center">
                        <span *ngIf="alertType === 'success'" class="text-xl mr-2"></span>
                        <span *ngIf="alertType === 'error'" class="text-xl mr-2"></span>
                        <span class="block sm:inline">{{ alertMessage }}</span>
                    </div>
                    <button (click)="hideAlert()" class="text-2xl leading-none" type="button">
                        &times;
                    </button>
                </div>
            </div>

            <div class="text-center mb-10" data-aos="zoom-in-up">
                <h2 class="text-3xl sm:text-4xl font-bold text-primary mb-3">تواصل معنا</h2>
                <p class="text-gray-600 max-w-2xl mx-auto">لا تتردد في مراسلتنا لأي استفسار أو طلب خدمة</p>
            </div>

            <div class="h-[600px] relative">
                <div class="h-full rounded-3xl overflow-hidden" data-aos="zoom-in-up">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d99564.2063002467!2d39.67179253802549!3d24.47615733477254!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sar!2seg!4v1758302026940!5m2!1sar!2seg"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div
                    class="flex justify-between md:flex-row gap-2.5 flex-col bg-transparent items-end w-[95%] top-[50%] left-[50%] h-auto -translate-x-1/2 md:-translate-y-1/2  absolute">
                    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" data-aos="fade-left"
                        class="contact-form rounded-2xl bg-white w-full md:w-2/3 lg:w-1/3 h-auto shadow-xl p-6  right-4 left-4 md:left-auto md:right-10">
                        <div class="mb-2">
                            <label for="name" class="block text-gray-600 mb-2">الاسم</label>
                            <input id="name" type="text" formControlName="name"
                                class="w-full px-4 py-2 border border-second-opacity-0 bg-second rounded-lg outline-0 focus:border-primary"
                                placeholder="ادخل الاسم" />
                            <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched"
                                class="text-red-500 text-sm mt-1">
                                الاسم مطلوب
                            </div>
                        </div>

                        <div class="mb-2">
                            <label for="phone" class="block text-gray-600 mb-2">رقم الهاتف</label>
                            <input id="phone" type="tel" formControlName="phone"
                                class="w-full px-4 py-2 border border-second-opacity-0 bg-second rounded-lg outline-0 focus:border-primary" />
                            <div *ngIf="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched"
                                class="text-red-500 text-sm mt-1">
                                رقم هاتف صحيح مطلوب
                            </div>
                        </div>

                        <div class="mb-2">
                            <label for="address" class="block text-gray-600 mb-1">العنوان</label>
                            <input id="address" type="text" formControlName="address"
                                class="w-full px-4 py-2 border border-second-opacity-0 bg-second rounded-lg outline-0 focus:border-primary"
                                placeholder="ادخل العنوان" />
                        </div>

                        <div class="mb-4">
                            <label for="message" class="block text-gray-600 mb-2">الرسالة</label>
                            <textarea id="message" formControlName="message" rows="3"
                                class="w-full px-4 py-2 border border-second-opacity-0  bg-second rounded-lg outline-0 focus:border-primary"
                                placeholder="اكتب رسالتك هنا"></textarea>
                            <span *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"
                                class="text-red-500 text-sm mt-1">
                                الرسالة مطلوبة
                            </span>
                        </div>

                        <button type="submit" [class.opacity-80]="contactForm.invalid"
                            class="w-full py-3 px-4 rounded-lg font-medium transition duration-300 border border-primary  bg-primary text-white hover:opacity-100">
                            إرسال
                        </button>
                    </form>
                    <div data-aos="fade-right"
                        class="contact-form rounded-2xl bg-white  shadow-xl p-4   right-4 left-4 md:left-10 md:right-auto">

                        <div class="flex gap-2  w-full items-center mb-2">
                            <svg version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" width="30px"
                                class="fill-primary " xmlns:xlink="http://www.w3.org/1999/xlink"
                                viewBox="0 0 425.963 425.963" xml:space="preserve">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <g>
                                        <path
                                            d="M213.285,0h-0.608C139.114,0,79.268,59.826,79.268,133.361c0,48.202,21.952,111.817,65.246,189.081 c32.098,57.281,64.646,101.152,64.972,101.588c0.906,1.217,2.334,1.934,3.847,1.934c0.043,0,0.087,0,0.13-0.002 c1.561-0.043,3.002-0.842,3.868-2.143c0.321-0.486,32.637-49.287,64.517-108.976c43.03-80.563,64.848-141.624,64.848-181.482 C346.693,59.825,286.846,0,213.285,0z M274.865,136.62c0,34.124-27.761,61.884-61.885,61.884 c-34.123,0-61.884-27.761-61.884-61.884s27.761-61.884,61.884-61.884C247.104,74.736,274.865,102.497,274.865,136.62z">
                                        </path>
                                    </g>
                                </g>
                            </svg>
                            <p class="text-gray-600 text-sm  ">شارع الملك فهد، حي بقيق، المدينة المنوّرة، المملكة
                                العربية
                                السعودية</p>
                        </div>
                        <div class="flex gap-2 w-full  items-center">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="30px"
                                class="fill-primary ">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <path
                                        d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z">
                                    </path>
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M12 7.25C12.4142 7.25 12.75 7.58579 12.75 8V11.6893L15.0303 13.9697C15.3232 14.2626 15.3232 14.7374 15.0303 15.0303C14.7374 15.3232 14.2626 15.3232 13.9697 15.0303L11.4697 12.5303C11.329 12.3897 11.25 12.1989 11.25 12V8C11.25 7.58579 11.5858 7.25 12 7.25Z"
                                        fill="white"></path>
                                </g>
                            </svg>
                            <p class="text-gray-600 text-sm ">متاحون 24 ساعة يوميًا</p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
